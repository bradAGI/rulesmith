[project]
name = "rulesmith"
version = "0.1.1"
description = "Search for rule programs that ask a small judge for typed decisions, with DSPy and GEPA."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "rulesmith contributors"}]
requires-python = ">=3.12,<3.15"
keywords = ["dspy", "gepa", "llm", "decision graphs", "rules", "program search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dspy==3.4.0",
    "gepa==0.1.4",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "typesafe-sdk>=0.6,<0.7",
]

[project.optional-dependencies]
doom = ["imageio-ffmpeg>=0.6,<1", "numpy>=2,<3", "pillow>=11,<13", "vizdoom>=1.3,<2"]
chess = ["chess>=1.11,<2"]
# Public benchmarks: parquet datasets, pinned dataset downloads, the trained-classifier baseline.
bench = ["huggingface-hub>=1,<2", "pyarrow>=17,<24", "scikit-learn>=1.5,<2"]
# `rulesmith clef-serve`: Cloudflare's Clef on PyTorch, at the versions its release was tested on
# or later. Its processor loads a video processor, which needs torchvision, even for text, and
# transformers' torch extra brings accelerate, which placing the weights on a device needs.
clef = [
    "huggingface-hub>=1,<2",
    "pillow>=11,<13",
    "torch>=2.11,<3",
    "torchvision>=0.26,<1",
    "transformers[torch]>=5.10.2,<6",
]

[project.urls]
Homepage = "https://github.com/bradAGI/rulesmith"
Repository = "https://github.com/bradAGI/rulesmith"
Issues = "https://github.com/bradAGI/rulesmith/issues"

[project.scripts]
rulesmith = "rulesmith.cli:main"

[dependency-groups]
# The suite covers the games and benchmarks too, so development installs every extra.
dev = ["rulesmith[doom,chess,bench]", "pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=25,<26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: paid calls to configured Jev and reflection models",
    "ruling: real inference against an explicitly configured Ruling server",
    "openai: real inference against an explicitly configured OpenAI-compatible chat API",
    "clef: real inference against an explicitly configured clef-serve",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.sdist]
# Only what the package and its tests need: listing it keeps local scratch and tool folders out.
# The docs' game videos run to tens of megabytes and are for reading on GitHub, not installing;
# the README's banner image is served from GitHub too (see the substitutions below).
only-include = ["src", "tests", "examples", "docs", "benchmarks", "README.md", "LICENSE", "uv.lock"]
exclude = ["docs/assets"]

# PyPI renders the README away from the repository, where its relative links and image would break.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\(((?!https?://)[^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/bradAGI/rulesmith/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\[([^\]]+)\]\(((?!https?://|#)[^)\s]+)\)'
replacement = '[\1](https://github.com/bradAGI/rulesmith/blob/main/\2)'
